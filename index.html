<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login — Solicitação de Salas CT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: white; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            padding: 48px; width: 100%; max-width: 440px; animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { font-size: 1.75rem; color: #1a1a2e; margin-bottom: 8px; }
        .login-header p { color: #6b7280; font-size: 0.95rem; }
        .profile-selector { display: flex; gap: 12px; margin-bottom: 24px; background: #f3f4f6; padding: 4px; border-radius: 12px; }
        .profile-option { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 10px;
            cursor: pointer; font-size: 0.9rem; font-weight: 500; color: #6b7280; transition: all 0.3s; }
        .profile-option.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 500; color: #374151; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px;
            font-size: 0.95rem; transition: all 0.3s; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; margin-top: 8px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        .alert { padding: 12px 16px; border-radius: 10px; margin-top: 16px; font-size: 0.9rem; display: none; }
        .alert.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert.warning { display: block; background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏫 Solicitação de Salas — CT</h1>
            <p>Entre com sua conta ou cadastre-se para solicitar salas</p>
        </div>

        <div class="profile-selector">
            <button class="profile-option active" data-profile="login" type="button">🔑 Entrar</button>
            <button class="profile-option" data-profile="cadastro" type="button">📝 Cadastrar</button>
        </div>

        <div id="form-login">
            <div class="form-group">
                <label for="login_email">E-mail:</label>
                <input type="email" id="login_email" placeholder="voce@ufc.br">
            </div>
            <div class="form-group">
                <label for="login_senha">Senha:</label>
                <input type="password" id="login_senha" placeholder="••••••••">
            </div>
            <button class="btn-primary" id="btn-login" type="button">Entrar</button>
        </div>

        <div id="form-cadastro" class="hidden">
            <div class="form-group">
                <label for="cad_nome">Nome completo:</label>
                <input type="text" id="cad_nome" placeholder="Ex: Maria Silva">
            </div>
            <div class="form-group">
                <label for="cad_email">E-mail:</label>
                <input type="email" id="cad_email" placeholder="voce@ufc.br">
            </div>
            <div class="form-group">
                <label for="cad_senha">Senha (mín. 6 caracteres):</label>
                <input type="password" id="cad_senha" placeholder="••••••••">
            </div>
            <button class="btn-primary" id="btn-cadastro" type="button">Cadastrar</button>
            <p style="font-size:0.8rem; color:#6b7280; margin-top:10px;">
                ⚠️ Após o cadastro, sua conta ficará <b>pendente de aprovação</b> do administrador.
            </p>
        </div>

        <div id="alert" class="alert"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        firebase.initializeApp(window.firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Garantia: se o firebase-config.js publicado for uma versão antiga (sem verificarAdmin)
        // ou estiver em cache, a página usa esta cópia e continua funcionando.
        if (typeof window.verificarAdmin !== 'function') {
            window.verificarAdmin = async function (db, user) {
                const email = (user.email || '').trim().toLowerCase();
                try {
                    const cfg = await db.collection('config').doc('admins').get();
                    if (cfg.exists) {
                        const d = cfg.data();
                        const lista = [].concat(d.emails || [], d.email || []).map(e => String(e).trim().toLowerCase());
                        if (lista.includes(email)) return true;
                    }
                } catch (e) { console.warn('config/admins:', e.message); }
                const u = await db.collection('usuarios').doc(user.uid).get();
                return u.exists && u.data().perfil === 'admin' && u.data().status === 'aprovado';
            };
        }

        // CORREÇÃO: createUserWithEmailAndPassword já dispara onAuthStateChanged ANTES do documento
        // em /usuarios ser gravado. Sem esta trava, o listener achava que o usuário "não existia",
        // fazia signOut() no meio do cadastro e a gravação do perfil podia falhar.
        let cadastrando = false;

        function showAlert(msg, tipo) {
            const a = document.getElementById('alert');
            a.textContent = msg;
            a.className = 'alert ' + tipo;
        }

        function msgErro(e) {
            const m = {
                'auth/invalid-credential': 'E-mail ou senha incorretos.',
                'auth/wrong-password': 'E-mail ou senha incorretos.',
                'auth/user-not-found': 'E-mail ou senha incorretos.',
                'auth/invalid-email': 'E-mail inválido.',
                'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
                'auth/weak-password': 'Senha fraca (mínimo 6 caracteres).',
                'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.',
                'auth/network-request-failed': 'Falha de rede. Verifique sua conexão.',
                'permission-denied': 'Permissão negada pelo Firestore (verifique as regras do banco).'
            };
            return m[e.code] || e.message;
        }

        function selectTab(tab) {
            document.querySelectorAll('.profile-option').forEach(b =>
                b.classList.toggle('active', b.dataset.profile === tab));
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-cadastro').classList.toggle('hidden', tab !== 'cadastro');
            document.getElementById('alert').className = 'alert';
        }

        // ---------- LOGIN ----------
        async function fazerLogin() {
            const email = document.getElementById('login_email').value.trim();
            const senha = document.getElementById('login_senha').value;
            if (!email || !senha) { showAlert('Informe e-mail e senha.', 'error'); return; }
            try {
                await auth.signInWithEmailAndPassword(email, senha);
                // onAuthStateChanged cuida do redirecionamento
            } catch (e) {
                showAlert('❌ Falha no login: ' + msgErro(e), 'error');
            }
        }

        // ---------- CADASTRO ----------
        async function fazerCadastro() {
            const nome = document.getElementById('cad_nome').value.trim();
            const email = document.getElementById('cad_email').value.trim();
            const senha = document.getElementById('cad_senha').value;
            if (!nome || !email.includes('@')) { showAlert('Preencha nome e e-mail válidos.', 'error'); return; }
            if (senha.length < 6) { showAlert('A senha deve ter pelo menos 6 caracteres.', 'error'); return; }
            cadastrando = true;
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, senha);
                await db.collection('usuarios').doc(cred.user.uid).set({
                    nome: nome, email: email.toLowerCase(), perfil: 'estudante',
                    status: 'pendente',
                    criado_em: firebase.firestore.FieldValue.serverTimestamp(),
                    ultimo_acesso: null
                });
                await auth.signOut(); // só entra depois da aprovação
                selectTab('login');
                showAlert('✅ Cadastro realizado! Aguarde a aprovação do administrador para entrar.', 'success');
            } catch (e) {
                showAlert('❌ Falha no cadastro: ' + msgErro(e), 'error');
                // se criou a conta mas falhou ao gravar o perfil, não deixa sessão "órfã" aberta
                if (auth.currentUser) { try { await auth.signOut(); } catch (_) {} }
            } finally {
                cadastrando = false;
            }
        }

        // ---------- SESSÃO / REDIRECIONAMENTO ----------
        auth.onAuthStateChanged(async (user) => {
            if (!user || cadastrando) return;
            try {
                // Admin? (lista de e-mails no documento config/admins — editável só pelo console)
                if (await window.verificarAdmin(db, user)) {
                    window.location.replace('admin.html');
                    return;
                }
                // Estudante: precisa estar aprovado
                const doc = await db.collection('usuarios').doc(user.uid).get();
                const st = doc.exists ? doc.data().status : null;
                if (st === 'aprovado') {
                    window.location.replace('estudante.html');
                    return;
                }
                await auth.signOut();
                if (st === 'pendente') showAlert('⏳ Cadastro aguardando aprovação do administrador.', 'warning');
                else showAlert('❌ Cadastro não aprovado. Procure a secretaria do CT.', 'error');
            } catch (e) {
                showAlert('Erro ao validar acesso: ' + msgErro(e), 'error');
                try { await auth.signOut(); } catch (_) {}
            }
        });

        // ---------- EVENTOS ----------
        document.querySelectorAll('.profile-option').forEach(b =>
            b.addEventListener('click', () => selectTab(b.dataset.profile)));
        document.getElementById('btn-login').addEventListener('click', fazerLogin);
        document.getElementById('btn-cadastro').addEventListener('click', fazerCadastro);
        ['login_email', 'login_senha'].forEach(id => document.getElementById(id)
            .addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); }));
        ['cad_nome', 'cad_email', 'cad_senha'].forEach(id => document.getElementById(id)
            .addEventListener('keydown', e => { if (e.key === 'Enter') fazerCadastro(); }));
    </script>
</body>
</html>
